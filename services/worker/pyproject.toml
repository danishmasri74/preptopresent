[project]
name = "preptopresent-worker"
version = "0.1.0"
description = "Background job worker for PrepToPresent (slides, speech analysis, scoring, AI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pymupdf>=2.1",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.8",
    "python-docx>=1.2.0",
    "pillow>=13.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
